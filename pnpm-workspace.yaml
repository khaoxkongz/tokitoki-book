  "@fontsource-variable/geist-mono": ^5.3.0
  "@types/node": ^24
  content-collections: ^0.2.1
  hast-util-to-string: ^3.0.1
  motion: ^12.43.0
  typescript: ^7.0.2
  unist-util-visit: ^5.1.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vite-plus: 0.2.7
  zod: ^4.4.3
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
